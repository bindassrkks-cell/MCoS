                                  Icon(imageVector = Icons.Default.AutoAwesome, contentDescription = "AI Summary", tint = accent)
                              }
                          }
                      )
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .verticalScroll(rememberScrollState())
