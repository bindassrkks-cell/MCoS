name: Build MCOS Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
      _JAVA_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate MCOS App Files
        run: |
          # 1. package.json
          cat << 'EOF' > package.json
          {
            "name": "mcos",
            "version": "1.0.0",
            "main": "index.js",
            "scripts": {
              "start": "expo start",
              "android": "expo run:android"
            },
            "dependencies": {
              "expo": "^51.0.0",
              "expo-status-bar": "~1.12.1",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.20.0",
              "@types/react": "~18.2.45",
              "babel-preset-expo": "^11.0.0",
              "typescript": "^5.1.3"
            },
            "private": true
          }
          EOF

          # 2. app.json
          cat << 'EOF' > app.json
          {
            "expo": {
              "name": "MCOS",
              "slug": "mcos",
              "version": "1.0.0",
              "orientation": "portrait",
              "userInterfaceStyle": "dark",
              "splash": {
                "backgroundColor": "#0B0F19"
              },
              "android": {
                "package": "com.mcos",
                "adaptiveIcon": {
                  "backgroundColor": "#0B0F19"
                }
              }
            }
          }
          EOF

          # 3. babel.config.js
          cat << 'EOF' > babel.config.js
          module.exports = function (api) {
            api.cache(true);
            return {
              presets: ['babel-preset-expo'],
            };
          };
          EOF

          # 4. tsconfig.json
          cat << 'EOF' > tsconfig.json
          {
            "extends": "expo/tsconfig.base",
            "compilerOptions": {
              "strict": true
            }
          }
          EOF

          # 5. index.js
          cat << 'EOF' > index.js
          import { registerRootComponent } from 'expo';
          import App from './App';

          registerRootComponent(App);
          EOF

          # 6. App.tsx (Splash + Login Screen)
          cat << 'EOF' > App.tsx
          import React, { useState, useEffect } from 'react';
          import {
            StyleSheet,
            Text,
            View,
            TextInput,
            TouchableOpacity,
            SafeAreaView,
            StatusBar,
            ActivityIndicator,
          } from 'react-native';

          export default function App() {
            const [isSplash, setIsSplash] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
              const timer = setTimeout(() => {
                setIsSplash(false);
              }, 2200);
              return () => clearTimeout(timer);
            }, []);

            const handleLogin = () => {
              if (!email || !password) {
                alert('Please enter both Email and Password');
                return;
              }
              setLoading(true);
              setTimeout(() => {
                setLoading(false);
                alert('Welcome to MCOS! Auth success.');
              }, 1200);
            };

            if (isSplash) {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar barStyle="light-content" backgroundColor="#0B0F19" />
                  <View style={styles.splashContent}>
                    <View style={styles.logoBadge}>
                      <Text style={styles.logoBadgeText}>MC</Text>
                    </View>
                    <Text style={styles.splashTitle}>MCOS</Text>
                    <Text style={styles.splashSubtitle}>Next-Gen Mobile Platform</Text>
                    <ActivityIndicator size="small" color="#00E5FF" style={{ marginTop: 28 }} />
                  </View>
                </SafeAreaView>
              );
            }

            return (
              <SafeAreaView style={styles.container}>
                <StatusBar barStyle="light-content" backgroundColor="#0B0F19" />
                <View style={styles.loginWrapper}>
                  <View style={styles.headerArea}>
                    <View style={styles.smallBadge}>
                      <Text style={styles.smallBadgeText}>MC</Text>
                    </View>
                    <Text style={styles.welcomeText}>Welcome to MCOS</Text>
                    <Text style={styles.instructionText}>Sign in to your account</Text>
                  </View>

                  <View style={styles.formArea}>
                    <Text style={styles.label}>Email Address</Text>
                    <TextInput
                      style={styles.input}
                      placeholder="user@mcos.io"
                      placeholderTextColor="#4B5563"
                      value={email}
                      onChangeText={setEmail}
                      autoCapitalize="none"
                      keyboardType="email-address"
                    />

                    <Text style={styles.label}>Password</Text>
                    <TextInput
                      style={styles.input}
                      placeholder="••••••••••••"
                      placeholderTextColor="#4B5563"
                      secureTextEntry
                      value={password}
                      onChangeText={setPassword}
                    />

                    <TouchableOpacity style={styles.loginBtn} onPress={handleLogin} activeOpacity={0.85}>
                      {loading ? (
                        <ActivityIndicator color="#0B0F19" />
                      ) : (
                        <Text style={styles.loginBtnText}>Sign In</Text>
                      )}
                    </TouchableOpacity>
                  </View>
                </View>
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              backgroundColor: '#0B0F19',
            },
            splashContent: {
              flex: 1,
              justifyContent: 'center',
              alignItems: 'center',
            },
            logoBadge: {
              width: 96,
              height: 96,
              borderRadius: 24,
              backgroundColor: '#111827',
              borderWidth: 2,
              borderColor: '#00E5FF',
              justifyContent: 'center',
              alignItems: 'center',
              marginBottom: 20,
            },
            logoBadgeText: {
              color: '#00E5FF',
              fontSize: 38,
              fontWeight: '900',
            },
            splashTitle: {
              fontSize: 34,
              fontWeight: '900',
              color: '#FFFFFF',
              letterSpacing: 6,
            },
            splashSubtitle: {
              fontSize: 14,
              color: '#9CA3AF',
              marginTop: 8,
            },
            loginWrapper: {
              flex: 1,
              justifyContent: 'center',
              paddingHorizontal: 28,
            },
            headerArea: {
              marginBottom: 32,
            },
            smallBadge: {
              width: 44,
              height: 44,
              borderRadius: 12,
              backgroundColor: '#111827',
              borderWidth: 1.5,
              borderColor: '#00E5FF',
              justifyContent: 'center',
              alignItems: 'center',
              marginBottom: 16,
            },
            smallBadgeText: {
              color: '#00E5FF',
              fontSize: 18,
              fontWeight: '800',
            },
            welcomeText: {
              fontSize: 28,
              fontWeight: '800',
              color: '#FFFFFF',
            },
            instructionText: {
              fontSize: 14,
              color: '#9CA3AF',
            },
            formArea: {
              gap: 8,
            },
            label: {
              color: '#D1D5DB',
              fontSize: 13,
              fontWeight: '600',
              marginTop: 10,
              marginBottom: 4,
            },
            input: {
              backgroundColor: '#111827',
              borderWidth: 1,
              borderColor: '#1F2937',
              borderRadius: 12,
              paddingHorizontal: 16,
              paddingVertical: 14,
              color: '#FFFFFF',
              fontSize: 15,
            },
            loginBtn: {
              backgroundColor: '#00E5FF',
              paddingVertical: 15,
              borderRadius: 12,
              alignItems: 'center',
              marginTop: 24,
            },
            loginBtnText: {
              color: '#0B0F19',
              fontSize: 16,
              fontWeight: '700',
            },
          });
          EOF

          # 7. .gitignore
          cat << 'EOF' > .gitignore
          node_modules/
          .expo/
          dist/
          android/
          ios/
          EOF

      - name: Commit and Push Source Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json app.json babel.config.js tsconfig.json index.js App.tsx .gitignore
          if git commit -m "feat(core): auto-generate and push MCOS source files [skip ci]"; then
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new source file changes to commit."
          fi

      - name: Install NPM Dependencies
        run: npm install

      - name: Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle Memory & Jetifier Fix
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "android.enableJetifier=false" >> android/gradle.properties

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOS-v1.0-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
