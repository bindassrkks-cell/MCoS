name: Build MCOS Neon APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push-native:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
      _JAVA_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create Native C++ & Fixed Kotlin JNI Bridge
        run: |
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/java/com/mcos
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

          # 1. CMakeLists.txt
          cat << 'EOF' > android/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(neon_backend)

          add_library(neon_backend SHARED NeonBackend.cpp)

          target_link_libraries(neon_backend
              android
              log
          )
          EOF

          # 2. NeonBackend.cpp (Native C++ Core with Database & Storage configuration)
          cat << 'EOF' > android/app/src/main/cpp/NeonBackend.cpp
          #include <jni.h>
          #include <string>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonProjectId(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("dry-king-57780977");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonBucket(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("binday");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonDataApi(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("https://ep-little-haze-ayplq02h.apirest.c-5.us-east-2.aws.neon.tech/neondb/rest/v1");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonS3Endpoint(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("https://br-cold-tree-ay0sxicu.storage.c-5.us-east-2.aws.neon.tech");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonRegion(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("us-east-2");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonAccessKey(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("nak_live_8bff28857082488eb6ba25c7006aabec");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonSecretKey(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("nsk_live_fbb596d3e48491ea1fc1fe6dd8fc29084747e355df467919dfb1c1dc01e88a33");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonNativeModule_getNeonAiKey(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("nt_live_8bff28857082_cgP7mO4L61b7sp2hOX608out2L7pDjjo");
          }
          EOF

          # 3. NeonNativeModule.kt
          cat << 'EOF' > android/app/src/main/java/com/mcos/NeonNativeModule.kt
          package com.mcos

          import com.facebook.react.bridge.Arguments
          import com.facebook.react.bridge.Promise
          import com.facebook.react.bridge.ReactApplicationContext
          import com.facebook.react.bridge.ReactContextBaseJavaModule
          import com.facebook.react.bridge.ReactMethod

          class NeonNativeModule(reactContext: ReactApplicationContext) : ReactContextBaseJavaModule(reactContext) {

              companion object {
                  init {
                      System.loadLibrary("neon_backend")
                  }
              }

              override fun getName(): String = "NeonBackend"

              private external fun getNeonProjectId(): String
              private external fun getNeonBucket(): String
              private external fun getNeonDataApi(): String
              private external fun getNeonS3Endpoint(): String
              private external fun getNeonRegion(): String
              private external fun getNeonAccessKey(): String
              private external fun getNeonSecretKey(): String
              private external fun getNeonAiKey(): String

              @ReactMethod
              fun getFullConfig(promise: Promise) {
                  try {
                      val map = Arguments.createMap().apply {
                          putString("projectId", getNeonProjectId())
                          putString("bucket", getNeonBucket())
                          putString("dataApiUrl", getNeonDataApi())
                          putString("endpoint", getNeonS3Endpoint())
                          putString("region", getNeonRegion())
                          putString("accessKey", getNeonAccessKey())
                          putString("secretKey", getNeonSecretKey())
                          putString("aiKey", getNeonAiKey())
                      }
                      promise.resolve(map)
                  } catch (e: Exception) {
                      promise.reject("NATIVE_CONFIG_ERROR", e.message)
                  }
              }
          }
          EOF

          # 4. NeonPackage.kt
          cat << 'EOF' > android/app/src/main/java/com/mcos/NeonPackage.kt
          package com.mcos

          import android.view.View
          import com.facebook.react.ReactPackage
          import com.facebook.react.bridge.NativeModule
          import com.facebook.react.bridge.ReactApplicationContext
          import com.facebook.react.uimanager.ReactShadowNode
          import com.facebook.react.uimanager.ViewManager

          class NeonPackage : ReactPackage {
              override fun createNativeModules(reactContext: ReactApplicationContext): List<NativeModule> {
                  return listOf(NeonNativeModule(reactContext))
              }

              override fun createViewManagers(reactContext: ReactApplicationContext): List<ViewManager<View, ReactShadowNode<*>>> {
                  return emptyList()
              }
          }
          EOF

          # 5. MainApplication.kt (Clean implementation without missing references)
          cat << 'EOF' > android/app/src/main/java/com/mcos/MainApplication.kt
          package com.mcos

          import android.app.Application
          import com.facebook.react.ReactApplication
          import com.facebook.react.ReactNativeHost
          import com.facebook.react.ReactPackage
          import com.facebook.react.shell.MainReactPackage
          import com.facebook.soloader.SoLoader

          class MainApplication : Application(), ReactApplication {

              private val mReactNativeHost = object : ReactNativeHost(this) {
                  override fun getUseDeveloperSupport(): Boolean = false

                  override fun getPackages(): List<ReactPackage> = listOf(
                      MainReactPackage(),
                      NeonPackage()
                  )

                  override fun getJSMainModuleName(): String = "index"
                  override fun getBundleAssetName(): String = "index.android.bundle"
              }

              override val reactNativeHost: ReactNativeHost
                  get() = mReactNativeHost

              override fun onCreate() {
                  super.onCreate()
                  SoLoader.init(this, false)
              }
          }
          EOF

          # 6. MainActivity.kt
          cat << 'EOF' > android/app/src/main/java/com/mcos/MainActivity.kt
          package com.mcos

          import com.facebook.react.ReactActivity

          class MainActivity : ReactActivity() {
              override fun getMainComponentName(): String = "mcos"
          }
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:name=".MainApplication"
                  android:label="MCOS"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:label="MCOS"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 8. Resources & Values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0B0F19</item>
                  <item name="android:windowBackground">#0B0F19</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B0F19"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M30,30h48v48h-48z"/>
          </vector>
          EOF

          # 9. Gradle Root Configuration
          cat << 'EOF' > android/settings.gradle
          rootProject.name = 'mcos'
          include ':app'
          EOF

          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.2.1")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 10. android/app/build.gradle with CMake configuration
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace "com.mcos"
              compileSdk 34
              ndkVersion "26.1.10909125"

              defaultConfig {
                  applicationId "com.mcos"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags ""
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.facebook.react:react-android:0.73.6")
              implementation("com.facebook.react:hermes-android:0.73.6")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          # 11. gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Commit and Push Native C++ Files to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android/
          if git commit -m "feat(native): link C++ neon backend and update android gradle setup [skip ci]"; then
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Native backend files are already up-to-date."
          fi

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Bundle React Native JS Code (Using repository App.tsx)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Download Standalone Gradle 8.5
        run: |
          curl -sSL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o "$RUNNER_TEMP/gradle-8.5-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.5-bin.zip" -d "$RUNNER_TEMP"

      - name: Ensure Clean Debug Keystore
        run: |
          rm -f android/app/debug.keystore
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android Debug APK
        run: |
          cd android
          $RUNNER_TEMP/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOS-Neon-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
