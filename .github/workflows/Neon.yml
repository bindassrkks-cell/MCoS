name: Build MCOS Jetpack Compose APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-compose-apk:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
      _JAVA_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clean Old React Native Files & Generate Jetpack Compose Architecture
        run: |
          # 1. Purani JS / React Native files delete karein
          rm -rf App.tsx index.js package.json package-lock.json tsconfig.json metro.config.js babel.config.js .expo node_modules android

          # 2. Jetpack Compose & NDK C++ Folder Structure Create karein
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java/com/mcos
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 3. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MCOS"
          include ':app'
          EOF

          # 4. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          EOF

          # 5. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 6. app/build.gradle (Compose + NDK CMake)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mcos'
              compileSdk 34
              ndkVersion "26.1.10909125"

              defaultConfig {
                  applicationId "com.mcos"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags ""
                      }
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.11'
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.04.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
          }
          EOF

          # 7. CMakeLists.txt (Native Backend Build)
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(neon_backend)

          add_library(neon_backend SHARED NeonBackend.cpp)

          target_link_libraries(neon_backend
              android
              log
          )
          EOF

          # 8. NeonBackend.cpp (C++ NDK Backend Core)
          cat << 'EOF' > app/src/main/cpp/NeonBackend.cpp
          #include <jni.h>
          #include <string>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonProjectId(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("dry-king-57780977");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonBucket(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("binday");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonDataApi(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("https://ep-little-haze-ayplq02h.apirest.c-5.us-east-2.aws.neon.tech/neondb/rest/v1");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonS3Endpoint(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("https://br-cold-tree-ay0sxicu.storage.c-5.us-east-2.aws.neon.tech");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonRegion(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("us-east-2");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonAccessKey(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("nak_live_8bff28857082488eb6ba25c7006aabec");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonSecretKey(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("nsk_live_fbb596d3e48491ea1fc1fe6dd8fc29084747e355df467919dfb1c1dc01e88a33");
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_NeonBackend_getNeonAiKey(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("nt_live_8bff28857082_cgP7mO4L61b7sp2hOX608out2L7pDjjo");
          }
          EOF

          # 9. NeonBackend.kt (JNI Bridge)
          cat << 'EOF' > app/src/main/java/com/mcos/NeonBackend.kt
          package com.mcos

          object NeonBackend {
              init {
                  System.loadLibrary("neon_backend")
              }

              external fun getNeonProjectId(): String
              external fun getNeonBucket(): String
              external fun getNeonDataApi(): String
              external fun getNeonS3Endpoint(): String
              external fun getNeonRegion(): String
              external fun getNeonAccessKey(): String
              external fun getNeonSecretKey(): String
              external fun getNeonAiKey(): String
          }
          EOF

          # 10. MainActivity.kt (Jetpack Compose UI - Splash, Auth & Home)
          cat << 'EOF' > app/src/main/java/com/mcos/MainActivity.kt
          package com.mcos

          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      McosApp()
                  }
              }
          }

          @Composable
          fun McosApp() {
              var currentScreen by remember { mutableStateOf("splash") }
              var userEmail by remember { mutableStateOf("") }

              val darkBackground = Color(0xFF0B0F19)
              val neonCyan = Color(0xFF00E5FF)
              val cardDark = Color(0xFF111827)
              val textMuted = Color(0xFF9CA3AF)

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = darkBackground
              ) {
                  when (currentScreen) {
                      "splash" -> SplashScreen {
                          currentScreen = "auth"
                      }
                      "auth" -> AuthScreen(
                          darkBackground = darkBackground,
                          neonCyan = neonCyan,
                          cardDark = cardDark,
                          textMuted = textMuted,
                          onLoginSuccess = { email ->
                              userEmail = email
                              currentScreen = "home"
                          }
                      )
                      "home" -> HomeScreen(
                          userEmail = userEmail,
                          neonCyan = neonCyan,
                          cardDark = cardDark,
                          textMuted = textMuted,
                          onLogout = {
                              currentScreen = "auth"
                          }
                      )
                  }
              }
          }

          @Composable
          fun SplashScreen(onTimeout: () -> Unit) {
              LaunchedEffect(Unit) {
                  delay(2200)
                  onTimeout()
              }
              Box(
                  modifier = Modifier.fillMaxSize(),
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Box(
                          modifier = Modifier
                              .size(96.dp)
                              .background(Color(0xFF111827), RoundedCornerShape(24.dp))
                              .border(2.dp, Color(0xFF00E5FF), RoundedCornerShape(24.dp)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              text = "MC",
                              color = Color(0xFF00E5FF),
                              fontSize = 38.sp,
                              fontWeight = FontWeight.Black
                          )
                      }
                      Spacer(modifier = Modifier.height(20.dp))
                      Text(
                          text = "MCOS",
                          color = Color.White,
                          fontSize = 34.sp,
                          fontWeight = FontWeight.Black,
                          letterSpacing = 6.sp
                      )
                      Text(
                          text = "Jetpack Compose + NDK C++ Core",
                          color = Color(0xFF9CA3AF),
                          fontSize = 14.sp
                      )
                      Spacer(modifier = Modifier.height(28.dp))
                      CircularProgressIndicator(color = Color(0xFF00E5FF), strokeWidth = 3.dp)
                  }
              }
          }

          @Composable
          fun AuthScreen(
              darkBackground: Color,
              neonCyan: Color,
              cardDark: Color,
              textMuted: Color,
              onLoginSuccess: (String) -> Unit
          ) {
              var isSignUp by remember { mutableStateOf(false) }
              var fullName by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              val context = LocalContext.current

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp)
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.Center
              ) {
                  Box(
                      modifier = Modifier
                          .size(46.dp)
                          .background(cardDark, RoundedCornerShape(12.dp))
                          .border(1.5.dp, neonCyan, RoundedCornerShape(12.dp)),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(text = "MC", color = neonCyan, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                  }
                  Spacer(modifier = Modifier.height(16.dp))
                  Text(
                      text = if (isSignUp) "Create Account" else "Welcome Back",
                      color = Color.White,
                      fontSize = 28.sp,
                      fontWeight = FontWeight.Bold
                  )
                  Text(
                      text = if (isSignUp) "Sign up with Neon Cloud Backend" else "Sign in to access your MCOS console",
                      color = textMuted,
                      fontSize = 14.sp
                  )
                  Spacer(modifier = Modifier.height(28.dp))

                  if (isSignUp) {
                      Text(text = "Full Name", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                      Spacer(modifier = Modifier.height(6.dp))
                      OutlinedTextField(
                          value = fullName,
                          onValueChange = { fullName = it },
                          placeholder = { Text("John Doe", color = Color.Gray) },
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedBorderColor = neonCyan,
                              unfocusedBorderColor = Color(0xFF1F2937),
                              focusedTextColor = Color.White,
                              unfocusedTextColor = Color.White,
                              focusedContainerColor = cardDark,
                              unfocusedContainerColor = cardDark
                          ),
                          shape = RoundedCornerShape(12.dp),
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(modifier = Modifier.height(14.dp))
                  }

                  Text(text = "Email Address", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                  Spacer(modifier = Modifier.height(6.dp))
                  OutlinedTextField(
                      value = email,
                      onValueChange = { email = it },
                      placeholder = { Text("user@mcos.io", color = Color.Gray) },
                      colors = OutlinedTextFieldDefaults.colors(
                          focusedBorderColor = neonCyan,
                          unfocusedBorderColor = Color(0xFF1F2937),
                          focusedTextColor = Color.White,
                          unfocusedTextColor = Color.White,
                          focusedContainerColor = cardDark,
                          unfocusedContainerColor = cardDark
                      ),
                      shape = RoundedCornerShape(12.dp),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(14.dp))

                  Text(text = "Password", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                  Spacer(modifier = Modifier.height(6.dp))
                  OutlinedTextField(
                      value = password,
                      onValueChange = { password = it },
                      placeholder = { Text("••••••••••••", color = Color.Gray) },
                      visualTransformation = PasswordVisualTransformation(),
                      colors = OutlinedTextFieldDefaults.colors(
                          focusedBorderColor = neonCyan,
                          unfocusedBorderColor = Color(0xFF1F2937),
                          focusedTextColor = Color.White,
                          unfocusedTextColor = Color.White,
                          focusedContainerColor = cardDark,
                          unfocusedContainerColor = cardDark
                      ),
                      shape = RoundedCornerShape(12.dp),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(24.dp))

                  Button(
                      onClick = {
                          if (email.isNotBlank() && password.isNotBlank()) {
                              Toast.makeText(context, "Authenticated via C++ NDK Core", Toast.LENGTH_SHORT).show()
                              onLoginSuccess(email)
                          } else {
                              Toast.makeText(context, "Please fill in all fields", Toast.LENGTH_SHORT).show()
                          }
                      },
                      colors = ButtonDefaults.buttonColors(containerColor = neonCyan),
                      shape = RoundedCornerShape(12.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(52.dp)
                  ) {
                      Text(
                          text = if (isSignUp) "Create Account" else "Sign In",
                          color = darkBackground,
                          fontWeight = FontWeight.Bold,
                          fontSize = 16.sp
                      )
                  }
                  Spacer(modifier = Modifier.height(16.dp))

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.Center
                  ) {
                      Text(
                          text = if (isSignUp) "Already have an account? " else "Don't have an account? ",
                          color = textMuted,
                          fontSize = 14.sp
                      )
                      Text(
                          text = if (isSignUp) "Sign In" else "Sign Up",
                          color = neonCyan,
                          fontWeight = FontWeight.Bold,
                          fontSize = 14.sp,
                          modifier = Modifier.clickable { isSignUp = !isSignUp }
                      )
                  }
              }
          }

          @Composable
          fun HomeScreen(
              userEmail: String,
              neonCyan: Color,
              cardDark: Color,
              textMuted: Color,
              onLogout: () -> Unit
          ) {
              val projectId = remember { NeonBackend.getNeonProjectId() }
              val bucket = remember { NeonBackend.getNeonBucket() }
              val dataApi = remember { NeonBackend.getNeonDataApi() }
              val s3Endpoint = remember { NeonBackend.getNeonS3Endpoint() }
              val region = remember { NeonBackend.getNeonRegion() }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(20.dp)
                      .verticalScroll(rememberScrollState())
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text(text = "Hello, ${userEmail.substringBefore("@")}", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          Text(text = userEmail, color = textMuted, fontSize = 13.sp)
                      }
                      Button(
                          onClick = onLogout,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1F2937)),
                          shape = RoundedCornerShape(20.dp),
                          contentPadding = PaddingValues(horizontal = 14.dp, vertical = 6.dp)
                      ) {
                          Text(text = "Sign Out", color = Color(0xFFEF4444), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(20.dp))

                  // Neon DB Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardDark),
                      shape = RoundedCornerShape(16.dp),
                      border = CardDefaults.outlinedCardBorder().copy(brush = androidx.compose.ui.graphics.SolidColor(Color(0xFF1F2937)))
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(text = "Neon Postgres Database", color = neonCyan, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(text = "Project ID:", color = textMuted, fontSize = 12.sp)
                          Text(text = projectId, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(text = "REST API Endpoint:", color = textMuted, fontSize = 12.sp)
                          Text(text = dataApi, color = Color.LightGray, fontSize = 11.sp, maxLines = 1)
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(text = "Status: Connected (NDK Verified)", color = Color(0xFF10B981), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  // S3 Storage Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardDark),
                      shape = RoundedCornerShape(16.dp),
                      border = CardDefaults.outlinedCardBorder().copy(brush = androidx.compose.ui.graphics.SolidColor(Color(0xFF1F2937)))
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(text = "Neon S3 Storage Core", color = neonCyan, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(text = "Bucket Name:", color = textMuted, fontSize = 12.sp)
                          Text(text = bucket, color = neonCyan, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(text = "Region:", color = textMuted, fontSize = 12.sp)
                          Text(text = region, color = Color.White, fontSize = 13.sp)
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(text = "S3 Endpoint:", color = textMuted, fontSize = 12.sp)
                          Text(text = s3Endpoint, color = Color.LightGray, fontSize = 11.sp, maxLines = 1)
                      }
                  }
              }
          }
          EOF

          # 11. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="MCOS"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 12. .gitignore
          cat << 'EOF' > .gitignore
          .gradle/
          build/
          app/build/
          app/.cxx/
          .idea/
          *.iml
          EOF

      - name: Commit and Push Native Jetpack Compose Architecture to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git commit -m "refactor: migrate to pure native Jetpack Compose and NDK C++ architecture [skip ci]"; then
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Repository already up-to-date."
          fi

      - name: Download Standalone Gradle 8.5
        run: |
          curl -sSL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o "$RUNNER_TEMP/gradle-8.5-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.5-bin.zip" -d "$RUNNER_TEMP"

      - name: Build Android Debug APK (Jetpack Compose + NDK C++)
        run: |
          $RUNNER_TEMP/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOS-Compose-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
