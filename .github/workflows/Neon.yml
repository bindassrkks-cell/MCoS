name: Build MCOS Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mcos:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
      _JAVA_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Directory Structure
        run: |
          mkdir -p android/app/src/main/java/com/mcos
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

      - name: Generate MCOS Core JS/TS Files
        run: |
          # 1. package.json
          cat << 'EOF' > package.json
          {
            "name": "mcos",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "react-native start"
            },
            "dependencies": {
              "react": "18.2.0",
              "react-native": "0.73.6"
            },
            "devDependencies": {
              "@babel/core": "^7.20.0",
              "@babel/runtime": "^7.20.0",
              "@react-native/babel-preset": "0.73.21",
              "@react-native/metro-config": "0.73.5",
              "@types/react": "^18.2.6",
              "typescript": "^5.0.4"
            }
          }
          EOF

          # 2. babel.config.js
          cat << 'EOF' > babel.config.js
          module.exports = {
            presets: ['module:@react-native/babel-preset'],
          };
          EOF

          # 3. metro.config.js
          cat << 'EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          module.exports = mergeConfig(getDefaultConfig(__dirname), {});
          EOF

          # 4. tsconfig.json
          cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "esnext",
              "module": "commonjs",
              "lib": ["es2017"],
              "allowJs": true,
              "jsx": "react-native",
              "noEmit": true,
              "isolatedModules": true,
              "strict": true,
              "moduleResolution": "node",
              "allowSyntheticDefaultImports": true,
              "esModuleInterop": true,
              "skipLibCheck": true
            }
          }
          EOF

          # 5. index.js
          cat << 'EOF' > index.js
          import { AppRegistry } from 'react-native';
          import App from './App';

          AppRegistry.registerComponent('mcos', () => App);
          EOF

          # 6. App.tsx (Neon Splash + Dark Login UI)
          cat << 'EOF' > App.tsx
          import React, { useState, useEffect } from 'react';
          import {
            StyleSheet,
            Text,
            View,
            TextInput,
            TouchableOpacity,
            SafeAreaView,
            StatusBar,
            ActivityIndicator,
            Alert,
          } from 'react-native';

          export default function App() {
            const [isSplash, setIsSplash] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
              const timer = setTimeout(() => {
                setIsSplash(false);
              }, 2200);
              return () => clearTimeout(timer);
            }, []);

            const handleLogin = () => {
              if (!email.trim() || !password.trim()) {
                Alert.alert('Authentication', 'Please enter your email and password');
                return;
              }
              setLoading(true);
              setTimeout(() => {
                setLoading(false);
                Alert.alert('MCOS', 'Login Successful! Welcome to MCOS.');
              }, 1200);
            };

            if (isSplash) {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar barStyle="light-content" backgroundColor="#0B0F19" />
                  <View style={styles.splashContent}>
                    <View style={styles.logoBadge}>
                      <Text style={styles.logoBadgeText}>MC</Text>
                    </View>
                    <Text style={styles.splashTitle}>MCOS</Text>
                    <Text style={styles.splashSubtitle}>Next-Gen Mobile Platform</Text>
                    <ActivityIndicator size="small" color="#00E5FF" style={{ marginTop: 28 }} />
                  </View>
                </SafeAreaView>
              );
            }

            return (
              <SafeAreaView style={styles.container}>
                <StatusBar barStyle="light-content" backgroundColor="#0B0F19" />
                <View style={styles.loginWrapper}>
                  <View style={styles.headerArea}>
                    <View style={styles.smallBadge}>
                      <Text style={styles.smallBadgeText}>MC</Text>
                    </View>
                    <Text style={styles.welcomeText}>Welcome to MCOS</Text>
                    <Text style={styles.instructionText}>Sign in to access your dashboard</Text>
                  </View>

                  <View style={styles.formArea}>
                    <Text style={styles.label}>Email Address</Text>
                    <TextInput
                      style={styles.input}
                      placeholder="user@mcos.io"
                      placeholderTextColor="#4B5563"
                      value={email}
                      onChangeText={setEmail}
                      autoCapitalize="none"
                      keyboardType="email-address"
                    />

                    <Text style={styles.label}>Password</Text>
                    <TextInput
                      style={styles.input}
                      placeholder="••••••••••••"
                      placeholderTextColor="#4B5563"
                      secureTextEntry
                      value={password}
                      onChangeText={setPassword}
                    />

                    <TouchableOpacity style={styles.loginBtn} onPress={handleLogin} activeOpacity={0.85}>
                      {loading ? (
                        <ActivityIndicator color="#0B0F19" />
                      ) : (
                        <Text style={styles.loginBtnText}>Sign In</Text>
                      )}
                    </TouchableOpacity>
                  </View>
                </View>
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              backgroundColor: '#0B0F19',
            },
            splashContent: {
              flex: 1,
              justifyContent: 'center',
              alignItems: 'center',
            },
            logoBadge: {
              width: 96,
              height: 96,
              borderRadius: 24,
              backgroundColor: '#111827',
              borderWidth: 2,
              borderColor: '#00E5FF',
              justifyContent: 'center',
              alignItems: 'center',
              marginBottom: 20,
            },
            logoBadgeText: {
              color: '#00E5FF',
              fontSize: 38,
              fontWeight: '900',
            },
            splashTitle: {
              fontSize: 34,
              fontWeight: '900',
              color: '#FFFFFF',
              letterSpacing: 6,
            },
            splashSubtitle: {
              fontSize: 14,
              color: '#9CA3AF',
              marginTop: 8,
            },
            loginWrapper: {
              flex: 1,
              justifyContent: 'center',
              paddingHorizontal: 28,
            },
            headerArea: {
              marginBottom: 32,
            },
            smallBadge: {
              width: 44,
              height: 44,
              borderRadius: 12,
              backgroundColor: '#111827',
              borderWidth: 1.5,
              borderColor: '#00E5FF',
              justifyContent: 'center',
              alignItems: 'center',
              marginBottom: 16,
            },
            smallBadgeText: {
              color: '#00E5FF',
              fontSize: 18,
              fontWeight: '800',
            },
            welcomeText: {
              fontSize: 28,
              fontWeight: '800',
              color: '#FFFFFF',
            },
            instructionText: {
              fontSize: 14,
              color: '#9CA3AF',
              marginTop: 6,
            },
            formArea: {
              gap: 8,
            },
            label: {
              color: '#D1D5DB',
              fontSize: 13,
              fontWeight: '600',
              marginTop: 10,
              marginBottom: 4,
            },
            input: {
              backgroundColor: '#111827',
              borderWidth: 1,
              borderColor: '#1F2937',
              borderRadius: 12,
              paddingHorizontal: 16,
              paddingVertical: 14,
              color: '#FFFFFF',
              fontSize: 15,
            },
            loginBtn: {
              backgroundColor: '#00E5FF',
              paddingVertical: 15,
              borderRadius: 12,
              alignItems: 'center',
              marginTop: 24,
            },
            loginBtnText: {
              color: '#0B0F19',
              fontSize: 16,
              fontWeight: '700',
            },
          });
          EOF

      - name: Generate Native Android Build Files
        run: |
          # 1. Android settings.gradle (Clean standard setup)
          cat << 'EOF' > android/settings.gradle
          rootProject.name = 'mcos'
          include ':app'
          EOF

          # 2. Android root build.gradle
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.2.1")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. Android app build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace "com.mcos"
              compileSdk 34

              defaultConfig {
                  applicationId "com.mcos"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.facebook.react:react-android:0.73.6")
              implementation("com.facebook.react:hermes-android:0.73.6")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          # 4. gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

          # 5. Resources & Icons
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0B0F19</item>
                  <item name="android:windowBackground">#0B0F19</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MCOS</string>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B0F19"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M30,30h48v48h-48z"/>
          </vector>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:name=".MainApplication"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:label="@string/app_name"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity & MainApplication
          cat << 'EOF' > android/app/src/main/java/com/mcos/MainActivity.kt
          package com.mcos

          import com.facebook.react.ReactActivity

          class MainActivity : ReactActivity() {
              override fun getMainComponentName(): String = "mcos"
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/mcos/MainApplication.kt
          package com.mcos

          import android.app.Application
          import com.facebook.react.ReactApplication
          import com.facebook.react.ReactNativeHost
          import com.facebook.react.ReactPackage
          import com.facebook.react.shell.MainReactPackage
          import com.facebook.soloader.SoLoader

          class MainApplication : Application(), ReactApplication {

              private val mReactNativeHost = object : ReactNativeHost(this) {
                  override fun getUseDeveloperSupport(): Boolean = false

                  override fun getPackages(): List<ReactPackage> = listOf(
                      MainReactPackage()
                  )

                  override fun getJSMainModuleName(): String = "index"

                  override fun getBundleAssetName(): String = "index.android.bundle"
              }

              override val reactNativeHost: ReactNativeHost
                  get() = mReactNativeHost

              override fun onCreate() {
                  super.onCreate()
                  SoLoader.init(this, false)
              }
          }
          EOF

          # 8. .gitignore
          cat << 'EOF' > .gitignore
          node_modules/
          dist/
          android/app/build/
          android/.gradle/
          .env
          EOF

      - name: Commit and Push All Sources to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git commit -m "feat(core): setup clean MCOS source files [skip ci]"; then
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Repository already up-to-date."
          fi

      - name: Install NPM Dependencies
        run: npm install

      - name: Pre-bundle React Native Offline JS Code
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Generate Fresh Debug Keystore
        run: |
          rm -f android/app/debug.keystore
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Standalone Gradle 8.5
        run: |
          curl -sSL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o "$RUNNER_TEMP/gradle-8.5-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.5-bin.zip" -d "$RUNNER_TEMP"

      - name: Build Android Debug APK
        run: |
          cd android
          $RUNNER_TEMP/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOS-v1.0-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
