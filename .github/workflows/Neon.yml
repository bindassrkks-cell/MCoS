name: Build MCOS Firebase Compose APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-and-build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
      _JAVA_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Safe Backup google-services.json & Clean Redundant Files
        run: |
          # 1. Aapke repo ke google-services.json ko safe backup karein
          mkdir -p /tmp/fb_safe_backup
          if [ -f "app/google-services.json" ]; then
            cp app/google-services.json /tmp/fb_safe_backup/google-services.json
            echo "Preserved existing app/google-services.json"
          elif [ -f "google-services.json" ]; then
            cp google-services.json /tmp/fb_safe_backup/google-services.json
            echo "Preserved root google-services.json"
          fi

          # 2. Files clean wipe karein (.git aur .github chhodkar)
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # 3. Directory structure create karein
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java/com/mcos
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 4. google-services.json ko app folder me safely restore karein
          if [ -f "/tmp/fb_safe_backup/google-services.json" ]; then
            cp /tmp/fb_safe_backup/google-services.json app/google-services.json
          else
            echo "Creating default fallback google-services.json"
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "mcos-firebase",
              "storage_bucket": "mcos-firebase.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:mcosapp00000000",
                  "android_client_info": {
                    "package_name": "com.mcos"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSy_Mcos_Realtime_Firebase_Key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Firebase Jetpack Compose & NDK Codebase
        run: |
          # 1. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MCOS"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.mcos'
              compileSdk 34
              ndkVersion "26.1.10909125"

              defaultConfig {
                  applicationId "com.mcos"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17"
                      }
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.11'
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.04.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              
              // Firebase Official BoM
              implementation platform('com.google.firebase:firebase-bom:33.1.0')
              implementation 'com.google.firebase:firebase-auth-ktx'
              implementation 'com.google.firebase:firebase-database-ktx'

              // Coil & Coroutines
              implementation 'io.coil-kt:coil-compose:2.6.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
          }
          EOF

          # 5. CMakeLists.txt
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(mcos_security_core)

          add_library(mcos_security SHARED
              McosSecurityCore.cpp
          )

          target_link_libraries(mcos_security
              android
              log
          )
          EOF

          # 6. app/src/main/cpp/McosSecurityCore.cpp
          cat << 'EOF' > app/src/main/cpp/McosSecurityCore.cpp
          #include <jni.h>
          #include <string>
          #include <sstream>
          #include <iomanip>
          #include <functional>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_McosSecurityCore_generateCloudinaryUserFolder(JNIEnv *env, jobject /* this */, jstring uid) {
              const char *uidStr = env->GetStringUTFChars(uid, nullptr);
              std::string rawUid(uidStr ? uidStr : "guest");
              if (uidStr) env->ReleaseStringUTFChars(uid, uidStr);

              size_t hashVal = std::hash<std::string>{}(rawUid + "_mcos_cloudinary_vault");
              std::stringstream ss;
              ss << "mcos_storage/" << rawUid << "/vault_" << std::hex << hashVal;
              return env->NewStringUTF(ss.str().c_str());
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_mcos_McosSecurityCore_getNativeSystemStatus(JNIEnv *env, jobject /* this */) {
              return env->NewStringUTF("Firebase Realtime Engine Active (C++ NDK Secured)");
          }
          EOF

          # 7. app/src/main/java/com/mcos/McosSecurityCore.kt
          cat << 'EOF' > app/src/main/java/com/mcos/McosSecurityCore.kt
          package com.mcos

          object McosSecurityCore {
              init {
                  System.loadLibrary("mcos_security")
              }

              external fun generateCloudinaryUserFolder(uid: String): String
              external fun getNativeSystemStatus(): String
          }
          EOF

          # 8. XML Resources
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MCoS</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.MCOS" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0B0F19</item>
                  <item name="android:navigationBarColor">#0B0F19</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B0F19"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M30,30h48v48h-48z"/>
          </vector>
          EOF

          # 9. app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MCOS">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.MCOS">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 10. app/src/main/java/com/mcos/MainActivity.kt (100% Fixed & Compilable)
          cat << 'EOF' > app/src/main/java/com/mcos/MainActivity.kt
          package com.mcos

          import android.os.Bundle
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.text.HtmlCompat
          import coil.compose.AsyncImage
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.database.*
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          // 👉 Apni Gemini Free Model API Key yahan change karein:
          const val GEMINI_API_KEY = "AIzaSy_YOUR_FREE_GEMINI_API_KEY_HERE"

          data class Article(
              val id: String = "",
              val title: String = "",
              val summary: String = "",
              val htmlContent: String = "",
              val imageUrl: String = "",
              val category: String = "",
              val timeAgo: String = "",
              val readTime: String = "",
              val author: String = ""
          )

          class MainActivity : ComponentActivity() {

              private val auth: FirebaseAuth by lazy { FirebaseAuth.getInstance() }
              private val database: FirebaseDatabase by lazy { FirebaseDatabase.getInstance() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      McosMainApp(auth, database)
                  }
              }
          }

          @Composable
          fun McosMainApp(auth: FirebaseAuth, database: FirebaseDatabase) {
              var isDarkMode by remember { mutableStateOf(true) }
              var currentScreen by remember { mutableStateOf("splash") }
              var userEmail by remember { mutableStateOf(auth.currentUser?.email ?: "") }
              var userId by remember { mutableStateOf(auth.currentUser?.uid ?: "") }
              var selectedArticle by remember { mutableStateOf<Article?>(null) }
              var isAiDialogVisible by remember { mutableStateOf(false) }
              var isAdminPostDialogVisible by remember { mutableStateOf(false) }

              val bg = if (isDarkMode) Color(0xFF0B0F19) else Color(0xFFF8FAFC)
              val cardBg = if (isDarkMode) Color(0xFF111827) else Color(0xFFFFFFFF)
              val textPrimary = if (isDarkMode) Color(0xFFF9FAFB) else Color(0xFF0F172A)
              val textMuted = if (isDarkMode) Color(0xFF9CA3AF) else Color(0xFF64748B)
              val accent = Color(0xFF00E5FF)
              val border = if (isDarkMode) Color(0xFF1F2937) else Color(0xFFE2E8F0)

              Surface(modifier = Modifier.fillMaxSize(), color = bg) {
                  when (currentScreen) {
                      "splash" -> SplashScreen(accent) {
                          currentScreen = if (auth.currentUser != null) "home" else "auth"
                      }
                      "auth" -> AuthScreen(
                          auth = auth, bg = bg, cardBg = cardBg, textPrimary = textPrimary,
                          textMuted = textMuted, accent = accent, border = border,
                          isDarkMode = isDarkMode, onToggleTheme = { isDarkMode = !isDarkMode },
                          onLoginSuccess = { email, uid ->
                              userEmail = email
                              userId = uid
                              currentScreen = "home"
                          }
                      )
                      "home" -> HomeScreen(
                          auth = auth, database = database, userEmail = userEmail, userId = userId,
                          bg = bg, cardBg = cardBg, textPrimary = textPrimary,
                          textMuted = textMuted, accent = accent, border = border,
                          isDarkMode = isDarkMode, onToggleTheme = { isDarkMode = !isDarkMode },
                          onOpenAi = { isAiDialogVisible = true },
                          onOpenAdminPost = { isAdminPostDialogVisible = true },
                          onSelectArticle = { article ->
                              selectedArticle = article
                              currentScreen = "details"
                          },
                          onLogout = {
                              auth.signOut()
                              currentScreen = "auth"
                          }
                      )
                      "details" -> ArticleDetailScreen(
                          article = selectedArticle, bg = bg, cardBg = cardBg, textPrimary = textPrimary,
                          textMuted = textMuted, accent = accent, border = border,
                          onOpenAiSummary = { isAiDialogVisible = true },
                          onBack = { currentScreen = "home" }
                      )
                  }

                  if (isAiDialogVisible) {
                      GeminiAiAssistantDialog(
                          cardBg = cardBg, textPrimary = textPrimary, textMuted = textMuted,
                          accent = accent, border = border,
                          articleContext = selectedArticle?.summary ?: "MCoS Platform",
                          onDismiss = { isAiDialogVisible = false }
                      )
                  }

                  if (isAdminPostDialogVisible) {
                      AdminAddArticleDialog(
                          database = database, cardBg = cardBg, textPrimary = textPrimary,
                          textMuted = textMuted, accent = accent, border = border,
                          authorName = userEmail.substringBefore("@"),
                          onDismiss = { isAdminPostDialogVisible = false }
                      )
                  }
              }
          }

          @Composable
          fun SplashScreen(accent: Color, onTimeout: () -> Unit) {
              LaunchedEffect(Unit) {
                  delay(2000)
                  onTimeout()
              }
              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Box(
                          modifier = Modifier
                              .size(96.dp)
                              .background(Color(0xFF111827), RoundedCornerShape(24.dp))
                              .border(2.dp, accent, RoundedCornerShape(24.dp)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(text = "MC", color = accent, fontSize = 38.sp, fontWeight = FontWeight.Black)
                      }
                      Spacer(modifier = Modifier.height(20.dp))
                      Text(text = "MCoS", color = Color.White, fontSize = 36.sp, fontWeight = FontWeight.Black, letterSpacing = 6.sp)
                      Text(text = "Firebase Realtime & NDK C++ Core", color = Color(0xFF9CA3AF), fontSize = 13.sp)
                      Spacer(modifier = Modifier.height(28.dp))
                      CircularProgressIndicator(color = accent, strokeWidth = 3.dp)
                  }
              }
          }

          @Composable
          fun AuthScreen(
              auth: FirebaseAuth, bg: Color, cardBg: Color, textPrimary: Color,
              textMuted: Color, accent: Color, border: Color, isDarkMode: Boolean,
              onToggleTheme: () -> Unit, onLoginSuccess: (String, String) -> Unit
          ) {
              var isSignUp by remember { mutableStateOf(false) }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var loading by remember { mutableStateOf(false) }
              val context = LocalContext.current

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp)
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.Center
              ) {
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Box(
                          modifier = Modifier
                              .size(44.dp)
                              .background(cardBg, RoundedCornerShape(12.dp))
                              .border(1.5.dp, accent, RoundedCornerShape(12.dp)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(text = "MC", color = accent, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                      }
                      IconButton(onClick = onToggleTheme) {
                          Icon(
                              imageVector = if (isDarkMode) Icons.Default.LightMode else Icons.Default.DarkMode,
                              contentDescription = "Theme", tint = accent
                          )
                      }
                  }
                  Spacer(modifier = Modifier.height(24.dp))
                  Text(text = if (isSignUp) "Register with Firebase" else "Welcome Back", color = textPrimary, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                  Text(text = "Realtime Database & Cloud Storage Node", color = textMuted, fontSize = 14.sp)
                  Spacer(modifier = Modifier.height(28.dp))

                  Text(text = "Email Address", color = textPrimary, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                  Spacer(modifier = Modifier.height(6.dp))
                  OutlinedTextField(
                      value = email, onValueChange = { email = it },
                      placeholder = { Text("user@mcos.io", color = textMuted) },
                      colors = OutlinedTextFieldDefaults.colors(
                          focusedBorderColor = accent, unfocusedBorderColor = border,
                          focusedTextColor = textPrimary, unfocusedTextColor = textPrimary,
                          focusedContainerColor = cardBg, unfocusedContainerColor = cardBg
                      ),
                      shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(14.dp))

                  Text(text = "Password", color = textPrimary, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                  Spacer(modifier = Modifier.height(6.dp))
                  OutlinedTextField(
                      value = password, onValueChange = { password = it },
                      placeholder = { Text("••••••••••••", color = textMuted) },
                      visualTransformation = PasswordVisualTransformation(),
                      colors = OutlinedTextFieldDefaults.colors(
                          focusedBorderColor = accent, unfocusedBorderColor = border,
                          focusedTextColor = textPrimary, unfocusedTextColor = textPrimary,
                          focusedContainerColor = cardBg, unfocusedContainerColor = cardBg
                      ),
                      shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(24.dp))

                  Button(
                      onClick = {
                          if (email.isNotBlank() && password.length >= 6) {
                              loading = true
                              if (isSignUp) {
                                  auth.createUserWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { res ->
                                          loading = false
                                          Toast.makeText(context, "Account Created Successfully", Toast.LENGTH_SHORT).show()
                                          onLoginSuccess(res.user?.email ?: email, res.user?.uid ?: "")
                                      }
                                      .addOnFailureListener { err ->
                                          loading = false
                                          Toast.makeText(context, err.message ?: "Sign up failed", Toast.LENGTH_LONG).show()
                                      }
                              } else {
                                  auth.signInWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { res ->
                                          loading = false
                                          Toast.makeText(context, "Sign In Success", Toast.LENGTH_SHORT).show()
                                          onLoginSuccess(res.user?.email ?: email, res.user?.uid ?: "")
                                      }
                                      .addOnFailureListener { err ->
                                          loading = false
                                          Toast.makeText(context, err.message ?: "Auth failed", Toast.LENGTH_LONG).show()
                                      }
                              }
                          } else {
                              Toast.makeText(context, "Please enter email and 6+ char password", Toast.LENGTH_SHORT).show()
                          }
                      },
                      colors = ButtonDefaults.buttonColors(containerColor = accent),
                      shape = RoundedCornerShape(12.dp),
                      modifier = Modifier.fillMaxWidth().height(52.dp)
                  ) {
                      if (loading) {
                          CircularProgressIndicator(color = Color(0xFF0B0F19), modifier = Modifier.size(22.dp))
                      } else {
                          Text(text = if (isSignUp) "Sign Up" else "Sign In", color = Color(0xFF0B0F19), fontWeight = FontWeight.Bold, fontSize = 16.sp)
                      }
                  }
                  Spacer(modifier = Modifier.height(16.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
                      Text(text = if (isSignUp) "Already registered? " else "Don't have an account? ", color = textMuted, fontSize = 14.sp)
                      Text(
                          text = if (isSignUp) "Sign In" else "Sign Up", color = accent,
                          fontWeight = FontWeight.Bold, fontSize = 14.sp, modifier = Modifier.clickable { isSignUp = !isSignUp }
                      )
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HomeScreen(
              auth: FirebaseAuth, database: FirebaseDatabase, userEmail: String, userId: String,
              bg: Color, cardBg: Color, textPrimary: Color, textMuted: Color, accent: Color, border: Color,
              isDarkMode: Boolean, onToggleTheme: () -> Unit, onOpenAi: () -> Unit, onOpenAdminPost: () -> Unit,
              onSelectArticle: (Article) -> Unit, onLogout: () -> Unit
          ) {
              val userStorageVault = remember(userId) { McosSecurityCore.generateCloudinaryUserFolder(userId) }
              var articlesList by remember { mutableStateOf<List<Article>>(emptyList()) }
              var isDbSyncing by remember { mutableStateOf(true) }

              // Live Realtime Database Listener
              DisposableEffect(Unit) {
                  val articlesRef = database.getReference("articles")
                  val listener = object : ValueEventListener {
                      override fun onDataChange(snapshot: DataSnapshot) {
                          val list = mutableListOf<Article>()
                          if (snapshot.exists()) {
                              for (child in snapshot.children) {
                                  val item = child.getValue(Article::class.java)
                                  if (item != null) list.add(0, item)
                              }
                          }
                          // Fallback initial article agar DB empty ho
                          if (list.isEmpty()) {
                              list.add(
                                  Article(
                                      id = "welcome_1",
                                      title = "MCoS Realtime Firebase Backend Active",
                                      summary = "Live synchronization from Firebase Realtime Database with Cloudinary and HTML Admin rendering.",
                                      htmlContent = "<h2>Welcome to MCoS</h2><p>Click the <b>Admin +</b> button below to publish new articles live to the database.</p>",
                                      imageUrl = "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=800&q=80",
                                      category = "System Core",
                                      timeAgo = "Live",
                                      readTime = "2 min read",
                                      author = "Admin"
                                  )
                              )
                          }
                          articlesList = list
                          isDbSyncing = false
                      }

                      override fun onCancelled(error: DatabaseError) {
                          isDbSyncing = false
                      }
                  }
                  articlesRef.addValueEventListener(listener)
                  onDispose {
                      articlesRef.removeEventListener(listener)
                  }
              }

              Scaffold(
                  containerColor = bg,
                  topBar = {
