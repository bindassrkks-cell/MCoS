name: Build MCOS Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
      _JAVA_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Auto-Verify & Self-Heal Build Environment
        run: |
          # 1. Google Services JSON check & placement
          if [ -f "google-services.json" ] && [ ! -f "app/google-services.json" ]; then
            cp google-services.json app/google-services.json
            echo "Moved google-services.json to app/ directory."
          fi

          if [ ! -f "app/google-services.json" ]; then
            echo "Warning: google-services.json missing, generating default placeholder."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "mcos-firebase",
              "storage_bucket": "mcos-firebase.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:mcosapp00000000",
                  "android_client_info": {
                    "package_name": "com.mcos"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSy_Mcos_Realtime_Firebase_Key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 2. JVM Memory & AndroidX configuration
          if [ ! -f "gradle.properties" ]; then
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" > gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.nonTransitiveRClass=true" >> gradle.properties
          fi

      - name: Download Standalone Gradle 8.5
        run: |
          curl -sSL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o "$RUNNER_TEMP/gradle-8.5-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.5-bin.zip" -d "$RUNNER_TEMP"

      - name: Compile Android Debug APK
        run: |
          $RUNNER_TEMP/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
